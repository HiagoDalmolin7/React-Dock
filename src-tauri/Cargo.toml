[package]
name = "react_dock"
version = "4.0.0"
description = "React Dock Liquid Glass para Windows 11"
authors = ["React Dock contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
