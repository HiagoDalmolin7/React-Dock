<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>React Dock · Liquid Glass</title></head><body>
<div class="root" id="root">
  <section class="panel hidden" id="panel" role="dialog" aria-label="Painel da React Dock">
    <header class="panel-head"><div class="panel-name"><span class="brand-disc">◆</span><strong id="panel-title">React Dock</strong></div><button class="close-btn" id="panel-close" title="Fechar">×</button></header>
    <div class="tabs"><button id="tab-tray">Bandeja</button><button id="tab-quick">Controles</button><button id="tab-settings">Aparência</button></div>
    <div class="panel-body" id="panel-body"></div>
  </section>
  <div class="dock-frame" id="dock-frame"><div class="glass-shine"></div><div class="glass-ambient"></div>
    <button id="home-button" class="fixed-icon" title="Menu Iniciar da React Dock"><span class="home-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="none" d="M2 4 11 2.8v8H2zM13 2.5 22 1v9.8h-9zM2 13h9v8.2L2 20zM13 13h9v10l-9-1.5z"/></svg></span></button>
    <div class="line"></div><div class="app-list" id="app-list"></div><div class="line"></div>
    <div class="system-icons"><button id="open-tray" class="system-icon" title="Bandeja"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 13h5l2 3h4l2-3h5"/></svg></button><button id="open-quick" class="system-icon" title="Controles rápidos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="8" cy="17" r="2" fill="currentColor"/></svg></button><button id="open-settings" class="system-icon" title="Configurações da dock"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9 7 7m10 10 2.1 2.1m0-14.2L17 7M7 17l-2.1 2.1"/></svg></button></div>
    <div class="system-time"><span id="battery-icon">▰</span><small id="battery-level">--</small><b id="clock">00:00</b></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>
<script type="module" src="/src/main.js"></script></body></html>
