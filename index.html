<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>React Dock · Liquid Glass</title></head><body>
<div class="root" id="root">
  <section class="panel hidden" id="panel" role="dialog" aria-label="Painel da React Dock">
    <header class="panel-head"><div class="panel-name"><span class="brand-disc">◆</span><strong id="panel-title">React Dock</strong></div><button class="close-btn" id="panel-close" title="Fechar">×</button></header>
    <div class="tabs"><button id="tab-tray">Bandeja</button><button id="tab-quick">Controles</button><button id="tab-settings">Aparência</button></div>
    <div class="panel-body" id="panel-body"></div>
  </section>
  <div class="dock-frame" id="dock-frame"><div class="glass-shine"></div><div class="glass-ambient"></div>
    <button id="home-button" class="fixed-icon" title="Explorador de arquivos"><span class="home-mark">◆</span></button>
    <div class="line"></div><div class="app-list" id="app-list"></div><div class="line"></div>
    <div class="system-icons"><button id="open-tray" class="system-icon" title="Bandeja">▦</button><button id="open-quick" class="system-icon" title="Controles rápidos">⌁</button><button id="open-settings" class="system-icon" title="Configurações da dock">⚙</button></div>
    <div class="system-time"><span id="battery-icon">▰</span><small id="battery-level">--</small><b id="clock">00:00</b></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>
<script type="module" src="/src/main.js"></script></body></html>
