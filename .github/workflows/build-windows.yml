name: React Dock Rust - Build Windows
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Rust + WebView2 (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dependencias web
        run: npm install --no-audit --no-fund
      - name: Testes JavaScript
        run: npm test
      - name: Compilacao frontend
        run: npm run build
      - name: Verificacao Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Testes Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Gerar instalador NSIS
        run: npm run tauri -- build --bundles nsis
      - name: Disponibilizar instalador
        uses: actions/upload-artifact@v7
        with:
          name: React-Dock-v4.1.0-Setup-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Disponibilizar executavel portatil
        uses: actions/upload-artifact@v7
        with:
          name: React-Dock-v4.1.0-Portable-Windows-x64
          path: src-tauri/target/release/react_dock.exe
          if-no-files-found: error
